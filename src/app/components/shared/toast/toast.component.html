<div class="toast-container">
  <div 
    *ngFor="let toast of toasts" 
    class="toast-card" 
    [ngClass]="toast.type"
  >
    <div class="toast-content">
      
      <svg *ngIf="toast.type === 'success'" lucideCheckCircle size="20" class="icon success-icon"></svg>
      <svg *ngIf="toast.type === 'error'" lucideAlertCircle size="20" class="icon error-icon"></svg>
      <svg *ngIf="toast.type === 'warning'" lucideAlertCircle size="20" class="icon warning-icon"></svg>
      <svg *ngIf="toast.type === 'info'" lucideInfo size="20" class="icon info-icon"></svg>

      <span class="toast-message">{{ toast.message }}</span>
    </div>

    <button class="toast-close" (click)="onRemove(toast.id)" title="Close alert">
      <svg lucideX size="16"></svg>
    </button>
  </div>
</div>
