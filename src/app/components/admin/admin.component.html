<div class="dashboard-container">

  <header class="navbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" width="28" height="28" style="fill: #EB0A1E; flex-shrink: 0; margin-right: 8px;">
        <path
          d="M32 10.414c-18.126 0-32 9.347-32 21.793C0 44.243 13.52 54 32 54s32-9.757 32-21.793c0-12.446-13.874-21.793-32-21.793zm19.953 9.347c.667 2.687-2.463 6.045-12.532 7.143-.67-6.842-2.7-12.623-6.063-13.847 4.528.128 8.82.893 12.562 2.25 3.5 1.32 5.673 3.004 6.033 4.453zm-14.915 12.34c0 8.67-2.604 12.263-5.038 12.263s-5.038-3.594-5.038-12.263v-.1A59.86 59.86 0 0 0 32 32.22a59.86 59.86 0 0 0 5.038-.209v.1zm-5.04-4.832a76.94 76.94 0 0 1-4.721-.138c.765-5.67 2.796-8.965 4.722-8.965s3.957 3.296 4.722 8.964c-1.452.1-3.024.138-4.723.138zm-19.954-7.51c.358-1.44 2.512-3.116 5.98-4.434 3.755-1.37 8.068-2.143 12.618-2.27-3.364 1.224-5.393 7.005-6.063 13.847-10.07-1.098-13.2-4.456-12.535-7.143zM4.72 31.422a14.67 14.67 0 0 1 3.368-9.468c.277 4.866 6.86 8.495 16.245 9.77l-.001.38c0 11.74 3 17.965 6.346 19.25-14.328-.515-25.958-9.34-25.958-19.93zm28.545 19.932c3.36-1.34 6.405-8.02 6.405-19.252l-.001-.38c9.386-1.274 15.968-4.903 16.245-9.77a14.67 14.67 0 0 1 3.368 9.468c0 10.605-11.662 19.44-26.017 19.932z" />
      </svg>
      <span class="brandName">
        NIPPON TOYOTA <span class="badge">ADMIN</span>
      </span>
    </div>

    <div class="controls">
      <div class="profile" *ngIf="user">
        <div class="avatar">{{ getInitials(user.name) }}</div>
        <div class="userInfo">
          <p class="userName">{{ user.name }}</p>
          <p class="userRole">System Administrator</p>
        </div>
      </div>

      <button class="logoutButton" (click)="onLogout()">
        <svg lucideLogOut size="16"></svg>
        <span>Sign Out</span>
      </button>
    </div>
  </header>

  <main class="main-content">
    <div class="headerSection">
      <div class="titleGroup">
        <h1>Toyota Administration Engine</h1>
        <p>Configure active dealership inventories and incentive slab structures</p>
      </div>

      <div style="display: flex; gap: 10px; align-items: center;">
        <label *ngIf="activeTab === 'inventory'" class="primaryBtn"
          style="background-color: transparent; border: 1px solid var(--border-color); color: var(--color-text-primary); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 0.85rem; height: 38px; box-sizing: border-box; margin: 0; box-shadow: none;">
          <svg lucideDownload size="16" style="transform: rotate(180deg); color: var(--toyota-red);"></svg>
          <span>Bulk Import CSV</span>
          <input type="file" accept=".csv" style="display: none;" (change)="onCSVSelected($event)" />
        </label>
        <button *ngIf="activeTab === 'inventory'" class="primaryBtn" (click)="openAddCarModal()"
          style="padding: 8px 16px; font-size: 0.85rem; height: 38px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; margin: 0; box-shadow: 0 2px 6px rgba(235, 10, 30, 0.15);">
          <svg lucidePlus size="16"></svg>
          <span>Add Model</span>
        </button>
      </div>
    </div>

    <div class="tabsContainer">
      <button class="tabBtn" [class.tabBtnActive]="activeTab === 'inventory'" (click)="activeTab = 'inventory'">
        <svg lucideCar size="16"></svg>
        <span>Vehicle Registry ({{ cars.length }})</span>
      </button>
      <button class="tabBtn" [class.tabBtnActive]="activeTab === 'slabs'" (click)="activeTab = 'slabs'">
        <svg lucideLayers size="16"></svg>
        <span>Dynamic Slabs ({{ slabs.length }})</span>
      </button>
      <button class="tabBtn" [class.tabBtnActive]="activeTab === 'dashboard'" (click)="activeTab = 'dashboard'">
        <svg lucideTrendingUp size="16"></svg>
        <span>Analytics Dashboard</span>
      </button>
      <button class="tabBtn" [class.tabBtnActive]="activeTab === 'officers'" (click)="activeTab = 'officers'">
        <svg lucideUsers size="16"></svg>
        <span>Sales Officers ({{ officers.length }})</span>
      </button>
      <button class="tabBtn" [class.tabBtnActive]="activeTab === 'reports'" (click)="activeTab = 'reports'">
        <svg lucideAward size="16"></svg>
        <span>Reports & Audits</span>
      </button>
    </div>

    <app-admin-inventory
      #inventoryComp
      *ngIf="activeTab === 'inventory'"
      [cars]="cars"
      [isLoadingCars]="isLoadingCars"
      (carSaved)="fetchCars(); fetchStats()"
      (carDeleted)="fetchCars(); fetchStats()">
    </app-admin-inventory>

    <app-admin-slabs
      *ngIf="activeTab === 'slabs'"
      [cars]="cars"
      [schemes]="schemes"
      [selectedSchemeId]="selectedSchemeId"
      [selectedScheme]="selectedScheme"
      [slabs]="slabs"
      [overrides]="overrides"
      [isLoadingSlabs]="isLoadingSlabs"
      (schemeSelected)="fetchSlabsAndOverridesForScheme($event)"
      (schemeDeleted)="onSlabsModified()"
      (schemeSaved)="onSlabsModified()">
    </app-admin-slabs>

    <app-admin-dashboard
      *ngIf="activeTab === 'dashboard'"
      [stats]="stats"
      [analyticsMonth]="analyticsMonth"
      [isLoadingStats]="isLoadingStats"
      [isGeneratingMock]="isGeneratingMock"
      (monthChange)="onMonthChange($event)"
      (generateMockData)="onGenerateMockData()">
    </app-admin-dashboard>

    <app-admin-officers
      *ngIf="activeTab === 'officers'"
      [officers]="officers"
      [analyticsMonth]="analyticsMonth"
      [isLoadingOfficers]="isLoadingOfficers"
      (monthChange)="onMonthChange($event)"
      (officerSaved)="onOfficersModified()"
      (targetSaved)="onOfficersModified()"
      (statusChanged)="onOfficersModified()">
    </app-admin-officers>

    <app-admin-reports
      *ngIf="activeTab === 'reports'"
      [reportsData]="reportsData"
      [reportsYear]="reportsYear"
      [analyticsMonth]="analyticsMonth"
      [leaderboard]="stats?.officerLeaderboard || []"
      [stats]="stats"
      [isLoadingReports]="isLoadingReports"
      [isLoadingStats]="isLoadingStats"
      (reportsYearChange)="onReportsYearChange($event)">
    </app-admin-reports>

  </main>
</div>
